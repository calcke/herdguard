name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - name: Allow location and vibration
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ('\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'
                   '\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
                   '\n    <uses-permission android:name="android.permission.VIBRATE"/>')
          s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + perms, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk herdguard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: herdguard-apk
          path: herdguard.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: HerdGuard Android (latest)
          files: herdguard.apk
          overwrite_files: true
